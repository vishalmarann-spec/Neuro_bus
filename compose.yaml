services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: neurobus
      POSTGRES_USER: neurobus
      POSTGRES_PASSWORD: neurobus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurobus -d neurobus"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - neurobus_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  neurobus_postgres:

